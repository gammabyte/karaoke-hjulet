    <style>
      .popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        width: 800px;
        height: 800px;
        -webkit-filter:
          drop-shadow(3px 0 0 #000)
          drop-shadow(-3px 0 0 #000)
          drop-shadow(0 3px 0 #000)
          drop-shadow(0 -3px 0 #000);
        filter:
          drop-shadow(3px 0 0 #000)
          drop-shadow(-3px 0 0 #000)
          drop-shadow(0 3px 0 #000)
          drop-shadow(0 -3px 0 #000);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 72px;
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        color: black;
        display: none;
        animation: flashZoom 3s ease-in-out forwards;
      }

      .popup-star {
        position: absolute;
        inset: 0;
        background-color: gold;
        clip-path: polygon(50% 0, 79% 90%, 2% 35%, 98% 35%, 21% 90%);
        animation: flashColors 3s ease-in-out forwards;
      }

      .popup p {
        position: absolute;
        top: 40%;
        left: 50%;
        z-index: 1;
        width: max-content;
        max-width: none;
        white-space: nowrap;
        text-align: center;
        transform: translate(-50%, -50%);
      }

      @keyframes flash {
        0% {
          background-color: gold;
        }
        50% {
          background-color: red;
        }
        100% {
          background-color: green;
        }
      }

      @keyframes flashZoom {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0;
        }
        25% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 1;
        }
        50% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        75% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0;
        }
      }

      @keyframes flashColors {
        0%, 75%, 100% {
          background-color: gold;
        }
        25% {
          background-color: red;
        }
        50% {
          background-color: green;
        }
      }

      #myElement {
        transition: transform 1s ease-in-out;
      }

      @font-face {
        font-family: myFirstFont;
        src: url(BetonCondensedBQ-Bold.otf);
        font-display: block; /* or block */
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }

      body {
        background-image: var(--theme-gradient), var(--theme-image);  
        background-blend-mode: overlay;
        background-color: rgba(240, 240, 240, 0.1);
        background-repeat: no-repeat, repeat;
        background-size: cover;
      }
  
      #leftbox {
        float: left;
        /*background: Red;*/
        width: 50%;
        height: 100%;
        overflow: hidden;
      }

      #middlebox {
        float: left;
        /*background: Green;*/
        width: 25%;
        height: 60%;
      }

      #rightbox {
        float: right;
        /*background: blue;*/
        width: 25%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      #roller-viewport {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        overflow: hidden;
      }

      #rollerCanvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #artist-list-control {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        color: white;
        background: linear-gradient(135deg, var(--button-shadow), #111);
        border-top: 2px solid var(--button-color);
        font: bold 12px Arial, sans-serif;
        text-transform: uppercase;
      }

      #artistListSelector {
        flex: 1;
        min-width: 0;
        appearance: none;
        border: 2px solid var(--button-color);
        border-radius: 6px;
        padding: 6px 28px 6px 8px;
        color: white;
        background-color: var(--button-shadow);
        font: bold 12px Arial, sans-serif;
        text-transform: uppercase;
        cursor: pointer;
      }

      #artistListSelector option {
        color: white;
        background: #171717;
      }

      #artist-list-control::after {
        content: "";
        position: absolute;
        top: 50%;
        right: 17px;
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--button-color);
        border-bottom: 2px solid var(--button-color);
        transform: translateY(-70%) rotate(45deg);
        pointer-events: none;
      }

      #artistListSelector:focus-visible {
        outline: 2px solid white;
        outline-offset: 2px;
      }

      #artistListSelector:hover:not(:disabled) {
        filter: brightness(1.15);
      }

      #artistListSelector:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .buttonbox {
        background-color: #00000055;
        border-radius: 10px;
        padding: 20px;
        margin: 20px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      input {
        padding: 10px;
      }

      .buttonbox > * {
        margin: 0;
      }

      #particles-js {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        z-index: -1;
      }

<div id="debug" class="debug-closed">
  <button id="debug-toggle" onclick="toggleDebug()">[ + ] SHOW DEBUG</button>
  
  <div id="debug-content">
    <script>
      var triangle = null;
      var wheelArrow = null;
      
      function toggleDebug() {
        const debugDiv = document.getElementById('debug');
        const btn = document.getElementById('debug-toggle');
        
        // Check current state and swap
        if (debugDiv.classList.contains('debug-closed')) {
          debugDiv.classList.replace('debug-closed', 'debug-open');
          btn.innerHTML = "[ – ] HIDE DEBUG";
        } else {
          debugDiv.classList.replace('debug-open', 'debug-closed');
          btn.innerHTML = "[ + ] SHOW DEBUG";
        }
      }

      function renderWheelHitStats(stats) {
        renderHitStats("wheel-hit-rows", stats, "No singers loaded");
      }

      function renderArtistHitStats(stats) {
        renderHitStats("artist-hit-rows", stats, "No artists loaded");
      }

      function setWheelBulbsEnabled(enabled) {
        if (typeof wheel1 !== "undefined" && wheel1) {
          wheel1.setBulbAnimationEnabled(enabled);
        }
      }

      function setRollerBulbsEnabled(enabled) {
        if (typeof roller !== "undefined" && roller) {
          roller.setBulbAnimationEnabled(enabled);
        }
      }

      function setTextAnimationsEnabled(enabled) {
        document.body.classList.toggle("debug-static-text-effects", !enabled);
      }

      function renderHitStats(rowsId, stats, emptyMessage) {
        const rows = document.getElementById(rowsId);
        if (!rows) return;
        rows.replaceChildren();

        if (stats.length === 0) {
          const row = rows.insertRow();
          const cell = row.insertCell();
          cell.colSpan = 5;
          cell.textContent = emptyMessage;
          return;
        }

        stats.forEach(({ index, entry, hits, weight, chance }) => {
          const row = rows.insertRow();
          [
            index,
            entry,
            hits,
            weight.toFixed(3),
            `${chance.toFixed(2)}%`
          ].forEach((value) => {
            row.insertCell().textContent = value;
          });
        });
      }

      function changeWheelWeightDecay() {
        const input = document.getElementById("wheel-weight-decay");
        const value = input.valueAsNumber;
        if (!input.checkValidity() || !Number.isFinite(value) || !wheel1) {
          input.reportValidity();
          if (wheel1) input.value = wheel1.weightDecay;
          return;
        }

        wheel1.setWeightDecay(value);
        roller.setWeightDecay(value);
      }

      function switchTheme(){
        changeTheme(); 
        initParticles(); 
        document.getElementById("theme-h").textContent =
          themeSelected.headerText ||
          `${themeSelected.name.toUpperCase()}${themeSelected.headerPostfix || ""}`;
        
        let primaryColor = themeSelected.wheelPrimarycolor;
        wheel1.theme(primaryColor);
        roller.theme(primaryColor);
        choices.theme(primaryColor);

        if(triangle != null){
          triangle.set({
            fill: adjustColor(primaryColor, 100),
            dirty: true
          });
        }

        if(wheelArrow != null){
          wheelArrow.requestRenderAll();
        }
      }

      function switchArtistList() {
        const selectedList = songLists[
          document.getElementById("artistListSelector").value
        ];
        roller.update(selectedList.artists);
        roller.init();
        roller.theme(themeSelected.wheelPrimarycolor);
      }

      function populateArtistListSelector() {
        const selector = document.getElementById("artistListSelector");
        selector.replaceChildren();
        Object.entries(songLists).forEach(([id, list]) => {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = list.name;
          selector.append(option);
        });
        selector.value = defaultSongListId;
      }

      let pendingCanvasResize = false;
      let canvasResizeTimeout = null;
      let resizeAfterSpinTimeout = null;
      let isWaitingForResize = false;

      function updateSpinButtons() {
        const singerButton = document.getElementById("spinSingerButton");
        const artistButton = document.getElementById("rollArtistButton");
        const artistListSelector = document.getElementById("artistListSelector");
        if (!singerButton || !artistButton) return;

        singerButton.disabled = !singerEnabled || isWaitingForResize;
        singerButton.textContent = isWaitingForResize
          ? "WAITING FOR RESIZE..."
          : singerEnabled
            ? "SPIN SINGER"
            : "SPINNING...";

        artistButton.disabled = !artistEnabled || isWaitingForResize;
        artistButton.textContent = isWaitingForResize
          ? "WAITING FOR RESIZE..."
          : artistEnabled
            ? "ROLL ARTIST"
            : "ROLLING...";
        if (artistListSelector) {
          artistListSelector.disabled = !artistEnabled || isWaitingForResize;
        }
      }

      function positionWheelArrow() {
        if (!wheelArrow || !triangle) return;

        const radius = Math.max(
          0,
          Math.min(wheelArrow.width, wheelArrow.height) / 2 - 40
        );
        const arrowCenterX = Math.min(
          wheelArrow.width / 2 + radius,
          wheelArrow.width -
            triangle.height / 2 -
            triangle.strokeWidth
        );
        triangle.set({
          left: arrowCenterX,
          top: wheelArrow.height / 2
        });
        triangle.setCoords();
        wheelArrow.requestRenderAll();
      }

      function resizeCanvases() {
        if (!wheel1 || !roller || !choices) return;
        if (!singerEnabled || !artistEnabled) {
          pendingCanvasResize = true;
          isWaitingForResize = true;
          updateSpinButtons();
          return;
        }
        if (resizeAfterSpinTimeout !== null) {
          pendingCanvasResize = true;
          return;
        }

        const wasWaitingForResize = isWaitingForResize;
        pendingCanvasResize = false;
        isWaitingForResize = false;
        wheel1.resize(
          document.getElementById("leftbox").offsetWidth,
          document.getElementById("leftbox").offsetHeight
        );
        roller.resize(
          document.getElementById("roller-viewport").offsetWidth,
          document.getElementById("roller-viewport").offsetHeight
        );
        choices.resize(
          document.getElementById("middlebox").offsetWidth,
          document.getElementById("middlebox").offsetHeight
        );

        if (wheelArrow && triangle) {
          wheelArrow.setDimensions({
            width: document.getElementById("leftbox").offsetWidth,
            height: document.getElementById("leftbox").offsetHeight
          });
          positionWheelArrow();
        }
        updateSpinButtons();
        if (wasWaitingForResize && singerEnabled && artistEnabled) {
          resumeTimer();
        }
      }

      function applyPendingCanvasResize() {
        if (pendingCanvasResize && singerEnabled && artistEnabled) {
          isWaitingForResize = true;
          updateSpinButtons();
          clearTimeout(resizeAfterSpinTimeout);
          resizeAfterSpinTimeout = setTimeout(() => {
            resizeAfterSpinTimeout = null;
            resizeCanvases();
          }, 3000);
        }
      }

      window.addEventListener("resize", () => {
        clearTimeout(canvasResizeTimeout);
        canvasResizeTimeout = setTimeout(resizeCanvases, 100);
      });
    </script>

    <script>
      var wheel1 = null;

      var singerEnabled = true;
      var artistEnabled = true;
      let singerPopupTimeout = null;
      let artistPopupTimeout = null;

      function enableArtist(enabled) {
        artistEnabled = enabled;

        if(artistEnabled && singerEnabled && !isWaitingForResize)
        {
          resumeTimer();
        } else {
          pauseTimer();
        }
        updateSpinButtons();
        document.getElementById("resetArtistButton").disabled = !enabled;
      }

      function enableSinger(enabled) {
        singerEnabled = enabled;

        if(artistEnabled && singerEnabled && !isWaitingForResize)
        {
          resumeTimer();
        } else {
          pauseTimer();
        }

        updateSpinButtons();
        document.getElementById("resetSingersButton").disabled = !enabled;
      }

      function resetArtist() {
        choices.resetArtist();
      }

      function resetSingers() {
        choices.resetSingers();
      }

      function rollArtist() {
        const duration = 2 + Math.random() * 5;

        const clipDuration = 2.759;

        var audio = new Audio("sound/spin.wav");
        const playbackRate = duration / duration;
        audio.playbackRate = playbackRate;

        const started = roller.roll(duration * 1000, (value) => {
          var audio2 = new Audio("sound/success.mp3");
          audio2.play();

          const popup = document.getElementById("myPopup2");
          const popupText = document.getElementById("popupText2");

          clearTimeout(artistPopupTimeout);
          popupText.innerHTML = value;

          popup.style.display = "none";
          void popup.offsetWidth;
          popup.style.display = "block";

          artistPopupTimeout = setTimeout(() => {
            popup.style.display = "none"; // Hide the popup after 5 seconds
          }, 5000);

          choices.addArtist(value);
          enableArtist(true);
          applyPendingCanvasResize();
        });

        if (!started) {
          console.warn("Artist roll skipped: every artist is in recent history.");
          return;
        }

        enableArtist(false);
        audio.play();
      }
      function spinSinger() {
        const clipDuration = 2.759;

        const rotationSeconds = 2 + Math.random() * 5;

        var audio = new Audio("sound/spin.wav");
        const playbackRate = clipDuration / rotationSeconds;
        audio.playbackRate = playbackRate;

        const started = wheel1.rotate(rotationSeconds, (value) => {
          var audio2 = new Audio("sound/success.mp3");
          audio2.play();

          const popup = document.getElementById("myPopup");
          const popupText = document.getElementById("popupText");

          clearTimeout(singerPopupTimeout);
          popupText.innerHTML = value;

          popup.style.display = "none";
          void popup.offsetWidth;
          popup.style.display = "block";

          singerPopupTimeout = setTimeout(() => {
            popup.style.display = "none"; // Hide the popup after 5 seconds
          }, 5000);

          choices.addSinger(value);
          enableSinger(true);
          applyPendingCanvasResize();
        }, choices.currentSingers);

        if (!started) {
          console.warn("Singer spin skipped: every wheel entry is in recent history.");
          return;
        }

        enableSinger(false);
        audio.play();
      }
      let hasUserInteracted = false;
      let curmusix = "myAudio1";
      function setup() {
        //https://freesound.org
        document.addEventListener("click", () => {
          if (!hasUserInteracted) {
            hasUserInteracted = true;
            document.getElementById(curmusix).volume = 0.1;

            document.getElementById(curmusix).play();
          }
        });

        document.addEventListener("visibilitychange", function () {
          let index = -1;
          let num = Math.random();
          if (num < 0.33) {
            index = 1;
          } else if (num < 0.66) {
            index = 2;
          } else {
            index = 3;
          }

          console.log("play music: " + index);

          let music = "myAudio" + index;

          document.getElementById(music).volume = 0.1;
          document.getElementById(curmusix).volume = 0.1;
          if (document.visibilityState === "visible") {
            document.getElementById(curmusix).pause();
            document.getElementById(music).play();

            curmusix = music;
          } else {
            document.getElementById(curmusix).pause();
          }
        });
        var wheelCanvas = new fabric.StaticCanvas("wheelCanvas");
        wheelCanvas.setWidth(document.getElementById("leftbox").offsetWidth);
        wheelCanvas.setHeight(document.getElementById("leftbox").offsetHeight);

        wheel1 = new Wheel("wheelCanvas", wheelCanvas, []);
        wheel1.onHitStats = renderWheelHitStats;
        wheel1.init();

        initSingers(handleSingerUpdate);


        let rollerCanvas = new fabric.StaticCanvas("rollerCanvas");
        const rollerViewport = document.getElementById("roller-viewport");
        rollerCanvas.setWidth(rollerViewport.offsetWidth);
        rollerCanvas.setHeight(
          rollerViewport.offsetHeight
        );

        roller = new Roller("rollerCanvas", rollerCanvas, []);
        roller.onHitStats = renderArtistHitStats;
        roller.init();

        var namesCanvas = new fabric.StaticCanvas("namesCanvas");
        namesCanvas.setWidth(document.getElementById("middlebox").offsetWidth);
        namesCanvas.setHeight(
          document.getElementById("middlebox").offsetHeight
        );

        choices = new Choices("namesCanvas", namesCanvas);
        choices.init();

        // arrow needs to be outside of wheel because of nasty full canvas rotation
        wheelArrow = new fabric.StaticCanvas("wheelArrow");
        wheelArrow.setWidth(document.getElementById("leftbox").offsetWidth);
        wheelArrow.setHeight(document.getElementById("leftbox").offsetHeight);

        const triangleHeight = 100;
        const triangleWidth = 100;

        const edgeThick = 4;

        triangle = new fabric.Triangle({
          width: triangleWidth - 5,
          height: triangleHeight,
          originX: "center",
          originY: "center",
          fill: "#FFAA1D",
          left: wheelArrow.width - triangleWidth - edgeThick,
          top: (wheelArrow.height - triangleHeight) / 2,
          stroke: "black",
          strokeWidth: edgeThick,
        });

        triangle.rotate(-90);

        wheelArrow.add(triangle);
        positionWheelArrow();
        const themeSelector = document.getElementById("themeSelector");
        const themeIds = Object.keys(themes);
        themeSelector.value = themeIds[Math.floor(Math.random() * themeIds.length)];
        switchTheme();
        populateArtistListSelector();
        switchArtistList();
      }
    </script>
